services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zhiya
      POSTGRES_PASSWORD: zhiya-local
      POSTGRES_DB: zhiya
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiya -d zhiya"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres-data:
