    section { margin: 0 auto 56px; max-width: 1600px; }
    .pair { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: start; }
    img { display: block; width: 100%; height: auto; border: 1px solid #ccd6cb; border-radius: 12px; }
    @media (max-width: 700px) { body { padding: 20px; } header { align-items: start; flex-direction: column; } .pair { grid-template-columns: 1fr; } .pair a:last-child { max-width: 390px; } }
